[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_ALLOWED_DOMAIN = "hbplus.fit"
  EXPO_PUBLIC_SUPABASE_URL = "https://uwklwnsrgbzkhpqcbqqj.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_I4PLL0x02a4-L1FzLrlFQQ_5XBNtQEJ"

# SPA Fallback redirects for routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

