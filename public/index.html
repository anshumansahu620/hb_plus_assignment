<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Website Favicon and Touch Icon (Official Hop with HB Logo) -->
    <link rel="icon" type="image/png" href="/hbplus-logo.png" />
    <link rel="apple-touch-icon" href="/hbplus-logo.png" />
    <!-- Preconnect & Google Fonts from example.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- Official HB+ Brand Fonts directly from example.html (Framer CDN) -->
    <style id="hbplus-official-fonts">
      /* The Seasons (Luxury Editorial Serif) */
      @font-face {
        font-family: 'The Seasons';
        src: url('https://framerusercontent.com/assets/FWhwpuJj1yqQclznRb0vw150zrg.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'The Seasons Bold';
        src: url('https://framerusercontent.com/assets/FWhwpuJj1yqQclznRb0vw150zrg.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'The Seasons';
        src: url('https://framerusercontent.com/assets/G403e7YXZAwPeajU6reh1YgGc4.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'The Seasons Regular';
        src: url('https://framerusercontent.com/assets/G403e7YXZAwPeajU6reh1YgGc4.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'The Seasons';
        src: url('https://framerusercontent.com/assets/QhwFBPKgQ1R5xA9xRFLsrChRiQk.woff2') format('woff2');
        font-weight: 300;
        font-style: italic;
        font-display: swap;
      }

      /* Gilroy (Modern Geometric Display Sans) */
      @font-face {
        font-family: 'Gilroy';
        src: url('https://framerusercontent.com/assets/xW4KxdL3urr5CJBCNuA6Ny1VfY.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Gilroy-Bold';
        src: url('https://framerusercontent.com/assets/xW4KxdL3urr5CJBCNuA6Ny1VfY.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Gilroy';
        src: url('https://framerusercontent.com/assets/beSsRzPet3JpBaKgmDqy4CMjE4.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Gilroy-Medium';
        src: url('https://framerusercontent.com/assets/beSsRzPet3JpBaKgmDqy4CMjE4.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Gilroy';
        src: url('https://framerusercontent.com/assets/xoyT1Ii8s93lOEumEF6TwKQCIw0.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Gilroy-Regular';
        src: url('https://framerusercontent.com/assets/xoyT1Ii8s93lOEumEF6TwKQCIw0.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Base Font Setup */
      html, body, button, input, textarea, select {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
